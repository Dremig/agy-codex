# ~/.codex/config.toml example when routing Codex directly to agy-codex local proxy
model_provider = "agy"
model = "gemini-4-argon"
model_reasoning_effort = "high"

[model_providers.agy]
name = "Antigravity"
base_url = "http://127.0.0.1:8317/v1"
wire_api = "responses"
experimental_bearer_token = "sk-agy-local"
requires_openai_auth = false
